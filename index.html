<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Itinerary</title>
  <meta name="description" content="Travel itinerary template" />

  <!-- Fonts: Playfair Display (headings) + Inter (body). Needs internet. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    NOTE: Almost everything on this page is filled in by script.js
    from the tripData object. You normally do NOT edit this file.
    Each empty container below has an id that script.js writes into.
  -->

  <!-- ============ NAVBAR ============ -->
  <header class="navbar" id="navbar">
    <div class="container navbar__inner">
      <a href="#home" class="navbar__brand" id="navBrand">Trip Name</a>
      <button class="navbar__toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="navbar__links" id="navLinks" aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#packages">Packages</a>
        <a href="#itinerary">Itinerary</a>
        <a href="#accommodation">Accommodation</a>
        <a href="#gallery">Gallery</a>
        <a href="#information">Information</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- ============ HERO ============ -->
    <section class="hero" id="home">
      <img class="hero__bg" id="heroImage" alt="" />
      <div class="hero__overlay"></div>
      <div class="container hero__content">
        <p class="eyebrow eyebrow--light" id="heroDuration"></p>
        <h1 class="hero__title" id="heroTitle"></h1>
        <p class="hero__tagline" id="heroTagline"></p>
        <a href="#packages" class="btn btn--light">Explore Packages</a>
      </div>
      <a href="#overview" class="hero__scroll" aria-label="Scroll down"><span></span></a>
    </section>

    <!-- ============ TRIP OVERVIEW ============ -->
    <section class="section section--tight" id="overview">
      <div class="container">
        <div class="overview-grid reveal" id="overviewGrid"></div>
      </div>
    </section>

    <!-- ============ PACKAGE SELECTION ============ -->
    <section class="section section--sand" id="packages">
      <div class="container">
        <div class="section-head reveal">
          <p class="eyebrow">Two ways to go</p>
          <h2 class="section-title">Choose Your Journey</h2>
        </div>
        <div class="package-grid" id="packageGrid"></div>
      </div>
    </section>

    <!-- ============ ITINERARY ============ -->
    <section class="section" id="itinerary">
      <div class="container">
        <div class="section-head reveal">
          <p class="eyebrow">Day by day</p>
          <h2 class="section-title">The Itinerary</h2>
        </div>

        <!-- Package switch (Package A / Package B) -->
        <div class="package-switch reveal" id="packageSwitch" role="tablist" aria-label="Select package"></div>

        <div class="swap" id="itineraryWrap">
          <p class="itinerary-intro" id="itineraryIntro"></p>
          <div class="day-tabs" id="dayTabs" role="tablist" aria-label="Select day"></div>
          <div class="day-header" id="dayHeader"></div>
          <div class="timeline" id="timeline"></div>
        </div>
      </div>
    </section>

    <!-- ============ ACCOMMODATION ============ -->
    <section class="section section--sand" id="accommodation">
      <div class="container">
        <div class="section-head reveal">
          <p class="eyebrow">Where you stay</p>
          <h2 class="section-title">Accommodation</h2>
        </div>
        <div class="swap" id="hotelWrap"></div>
      </div>
    </section>

    <!-- ============ INCLUSIONS / EXCLUSIONS ============ -->
    <section class="section" id="inclusions">
      <div class="container">
        <div class="section-head reveal">
          <p class="eyebrow">The details</p>
          <h2 class="section-title">What's Covered</h2>
        </div>
        <div class="incl-grid swap" id="inclWrap"></div>
      </div>
    </section>

    <!-- ============ GALLERY ============ -->
    <section class="section section--dark" id="gallery">
      <div class="container">
        <div class="section-head section-head--light reveal">
          <p class="eyebrow eyebrow--light">Moments</p>
          <h2 class="section-title">Gallery</h2>
        </div>
        <div class="gallery" id="galleryGrid"></div>
      </div>
    </section>

    <!-- ============ IMPORTANT INFORMATION ============ -->
    <section class="section" id="information">
      <div class="container container--narrow">
        <div class="section-head reveal">
          <p class="eyebrow">Before you go</p>
          <h2 class="section-title">Important Information</h2>
        </div>
        <div class="accordion reveal" id="accordion"></div>
      </div>
    </section>

    <!-- ============ FINAL PACKAGE CARD ============ -->
    <section class="section section--sand" id="summary">
      <div class="container container--narrow">
        <div class="summary reveal swap" id="summaryCard"></div>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer" id="footer"></footer>

  <!-- ============ LIGHTBOX ============ -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Previous">&#8249;</button>
    <img class="lightbox__img" id="lbImg" alt="" />
    <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Next">&#8250;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
